services:
  db:
    image: postgres:16
    container_name: focinho_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: focinho
      POSTGRES_PASSWORD: focinho123
      POSTGRES_DB: focinho_db

    ports:
      - "5432:5432"

    volumes:
      - focinho_pgdata:/var/lib/postgresql/data

volumes:
  focinho_pgdata: